<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR.js Surface of Conjugation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        .arjs-loader {
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .arjs-loader div {
            text-align: center;
            font-size: 1.25em;
            color: white;
        }
        .status {
            position: fixed;
            top: 10px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 100;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="arjs-loader">
        <div>Loading, please wait...</div>
    </div>
    
    <div class="status" id="status">Tracking marker...</div>
    
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <script>
        function updateStatus(message) {
            document.getElementById('status').textContent = message;
        }
        
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.querySelector('.arjs-loader').style.display = 'none';
                updateStatus('Camera ready. Point at marker');
            }, 1000);
        });
        
        AFRAME.registerComponent('surface-conjugation-model', {
            init: function() {
                try {
                    const geometry = new THREE.BufferGeometry();
                    const vertices = [];
                    const indices = [];
                    
                    // Parameters for Surface of Conjugation of Two Coaxial Cylinders
                    const R1 = 0.8;  // radius of first cylinder
                    const R2 = 2.4;  // radius of second cylinder (R2 > R1)
                    const b = 2.4;   // height parameter
                    const scale = 0.5; // overall scale factor
                    
                    // Parameter ranges
                    const alphaSegments = 36;  // resolution for alpha parameter
                    const betaSegments = 24;   // resolution for beta parameter
                    const alphaMin = 0;
                    const alphaMax = 2 * Math.PI;  // full rotation
                    const betaMin = 0;
                    const betaMax = 2 * Math.PI;   // full rotation around axis
                    
                    // Generate vertices using parametric equations
                    for (let ai = 0; ai <= alphaSegments; ai++) {
                        const alpha = alphaMin + (alphaMax - alphaMin) * (ai / alphaSegments);
                        
                        for (let bi = 0; bi <= betaSegments; bi++) {
                            const beta = betaMin + (betaMax - betaMin) * (bi / betaSegments);
                            
                            // Calculate r(α) using the law of change of radius
                            const r = (R2 - R1) * Math.pow(Math.sin(Math.PI * alpha / (4 * b)), 2) + R1;
                            
                            // Parametric equations for the surface
                            const x = r * Math.cos(beta) * scale;
                            const y = r * Math.sin(beta) * scale;
                            const z = alpha * scale;
                            
                            vertices.push(x, y, z);
                        }
                    }
                    
                    // Generate triangle indices
                    for (let ai = 0; ai < alphaSegments; ai++) {
                        for (let bi = 0; bi < betaSegments; bi++) {
                            const current = ai * (betaSegments + 1) + bi;
                            const next = (ai + 1) * (betaSegments + 1) + bi;
                            
                            // First triangle
                            indices.push(current, next, current + 1);
                            
                            // Second triangle
                            indices.push(current + 1, next, next + 1);
                        }
                    }
                    
                    geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                    geometry.setIndex(indices);
                    geometry.computeVertexNormals();
                    
                    const material = new THREE.MeshLambertMaterial({
                        color: 0x4444ff,
                        transparent: true,
                        opacity: 0.8,
                        side: THREE.DoubleSide
                    });
                    
                    const mesh = new THREE.Mesh(geometry, material);
                    this.el.setObject3D('mesh', mesh);
                    
                    const wireframeMaterial = new THREE.LineBasicMaterial({ 
                        color: 0x000088, 
                        linewidth: 1 
                    });
                    const wireframe = new THREE.LineSegments(
                        new THREE.WireframeGeometry(geometry),
                        wireframeMaterial
                    );
                    this.el.object3D.add(wireframe);
                    
                    this.el.object3D.scale.set(0.3, 0.3, 0.3);
                    this.el.object3D.position.set(0, 0.5, 0);
                    
                    this.el.object3D.rotation.x = -Math.PI / 2;
                    
                    updateStatus('Surface of Conjugation model loaded successfully!');
                    
                } catch (error) {
                    console.error('Error creating Surface of Conjugation model:', error);
                    updateStatus('Error: ' + error.message);
                }
            },
            
            tick: function(time, timeDelta) {
                if (this.el.object3D) {
                    this.el.object3D.rotation.z += 0.005;
                }
            }
        });
        
        AFRAME.registerComponent('marker-handler', {
            schema: {
                name: {type: 'string', default: 'marker'}
            },
            
            init: function() {
                const marker = this.el;
                const markerName = this.data.name;
                
                marker.addEventListener('markerFound', function() {
                    updateStatus(`${markerName} found! Displaying Surface of Conjugation.`);
                });
                
                marker.addEventListener('markerLost', function() {
                    updateStatus(`${markerName} lost. Point camera at marker.`);
                });
            }
        });
    </script>
    
    <a-scene 
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix;"
        vr-mode-ui="enabled: false">
        
        <!-- Add some lighting for better appearance -->
        <a-light type="ambient" color="#404040"></a-light>
        <a-light type="directional" position="1 1 1" color="#ffffff"></a-light>
        
        <a-marker preset="hiro" marker-handler="name: Hiro marker">
            <a-entity surface-conjugation-model position="0 0 0"></a-entity>
        </a-marker>
        
        <a-marker type="pattern" url="pattern-marker.patt" marker-handler="name: Custom marker">
            <a-entity surface-conjugation-model position="0 0 0"></a-entity>
        </a-marker>
        
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
